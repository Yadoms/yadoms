info:
  name: Ajouter une page avec nom acentué
  type: http
  seq: 1

http:
  method: POST
  url: http://{{yadoms_ip}}:{{yadoms_port}}/rest/page
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "été çà"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
