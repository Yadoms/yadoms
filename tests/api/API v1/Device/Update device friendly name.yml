info:
  name: Update device friendly name
  type: http
  seq: 11

http:
  method: PUT
  url: http://{{yadoms_ip}}:{{yadoms_port}}/rest/device/1
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "friendlyName" : "titi"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
