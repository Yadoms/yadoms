info:
  name: server configuration
  type: http
  seq: 1

http:
  method: GET
  url: http://{{yadoms_ip}}:{{yadoms_port}}/rest/configurations/server
  headers:
    - name: Content-Type
      value: application/x-www-form-urlencoded;charset=utf-8
    - name: dataType
      value: json
  body:
    type: text
    data: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
