info:
  name: keywords acquisitions
  type: http
  seq: 2

http:
  method: GET
  url: http://{{yadoms_ip}}:{{yadoms_port_v2}}/rest/v2/keywords/:keywordIds/acquisitions?limit=10
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: from-date
      value: 20211117T172527
      type: query
      description: "[Optional] start date"
      disabled: true
    - name: to-date
      value: 20211123T180000
      type: query
      description: "[Optional] end date"
      disabled: true
    - name: limit
      value: "10"
      type: query
      description: "[Optional] Max records count"
    - name: resolution
      value: hour
      type: query
      description: "[Optional] all, hour, day, month, year ('all' by default)"
      disabled: true
    - name: prop
      value: min|max
      type: query
      description: "[Optional] average|min|max|count (ignored if resolution set to 'all')"
      disabled: true
    - name: keywordIds
      value: 179|1251|1
      type: path
      description: "[Optional] keyword ID list"
  auth: inherit

runtime:
  variables:
    - name: yadoms_ip
      value: 127.0.0.1
    - name: yadoms_port_v2
      value: "8080"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

