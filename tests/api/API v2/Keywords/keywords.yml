info:
  name: keywords
  type: http
  seq: 1

http:
  method: GET
  url: http://{{yadoms_ip}}:{{yadoms_port_v2}}/rest/v2/keywords/:keywordIds?from-capacity-name=pluginState|switch|frequency&prop=id|friendly-name|type
  params:
    - name: from-device-id
      value: "4"
      type: query
      description: "[Optional] "
      disabled: true
    - name: from-capacity-name
      value: pluginState|switch|frequency
      type: query
      description: "[Optional] switch|event|temperature|text|load|voltage|..."
    - name: from-access-mode
      value: get
      type: query
      description: "[Optional] get, getset, noaccess"
      disabled: true
    - name: from-friendly-name
      value: signalPower
      type: query
      description: "[Optional] "
      disabled: true
    - name: from-data-type
      value: numeric|bool
      type: query
      description: "[Optional] nodata|string|numeric|bool|json|enum|datetime"
      disabled: true
    - name: from-units
      value: noUnit
      type: query
      description: "[Optional] noUnit, ampere, ampereHour, cubicMetre, cubicMeterPerSecond, decibel, decibelPerMilliWatt, degrees, degreesCelcius, degreesFarenheit, hectoPascal, hertz, kg, lux, meter, metersPerSecond, millimeter, millimeterPerSecond, percent, second, uv, volt, voltAmpere, watt, wattPerHour, wattPerSquareMeter"
      disabled: true
    - name: from-measure
      value: absolute
      type: query
      description: "[Optional] absolute, increment, cumulative"
      disabled: true
    - name: with-blacklisted
      value: ""
      type: query
      description: "[Optional] "
      disabled: true
    - name: from-history-depth
      value: nohistory
      type: query
      description: "[Optional] default, nohistory"
      disabled: true
    - name: prop
      value: id|friendly-name|type
      type: query
      description: "[Optional] id|device-id|capacity-name|access-mode|friendly-name|type|units|type-info|measure|details|blacklisted|last-acquisition-value|last-acquisition-date|history-depth|"
    - name: keywordIds
      value: ""
      type: path
      description: "[Optional] keyword ID list"
  auth: inherit

runtime:
  variables:
    - name: yadoms_ip
      value: 127.0.0.1
    - name: yadoms_port_v2
      value: "8080"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

