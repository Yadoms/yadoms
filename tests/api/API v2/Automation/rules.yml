info:
  name: rules
  type: http
  seq: 4

http:
  method: GET
  url: http://{{yadoms_ip}}:{{yadoms_port_v2}}/rest/v2/automation/rules/:id
  params:
    - name: from-name
      value: Température Pi
      type: query
      description: "[optional] Filter for a specific rule name"
      disabled: true
    - name: from-interpreter
      value: yPython27
      type: query
      description: "[optional] Filter for specific rule interpreters (list)"
      disabled: true
    - name: from-editor
      value: blockly
      type: query
      description: "[optional] Filter for a specific rule editor"
      disabled: true
    - name: from-autostart
      value: ""
      type: query
      description: "[optional] Filter for a autostarted rules"
      disabled: true
    - name: from-state
      value: error
      type: query
      description: |-
        [optional] Filter for specific rule states (list). Accepted values are :
        stopped, running, error
      disabled: true
    - name: prop
      value: code|id
      type: query
      description: |-
        [optional] A flags combinaison of following values (returns all values if no prop provided) :
        id|name|description|interpreter|editor|model|content|configuration|autostart|state|errorMessage|startDate|stopDate|code
      disabled: true
    - name: id
      value: "56"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
