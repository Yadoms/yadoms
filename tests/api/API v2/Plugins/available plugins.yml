  - name: Plugin with configuration schema
    request:
      url: http://{{yadoms_ip}}:{{yadoms_port_v2}}/rest/v2/plugins?byType=dev-fakePlugin&prop=configurationSchema
      method: GET
      headers:
        - name: Accept-Language
          value: fr
          description: "Optional : provides translations if requested (en langugage if requested language not found)"
      params:
        - name: byType
          value: dev-fakePlugin
          type: query
          description: "[optional] Filter by plugin type. Returns all plugins if ommited"
        - name: prop
          value: configurationSchema
          type: query
          description: |-
            [optional] A flags combinaison of following values (returns all values if no prop provided, except for icon that must be requested alone) :
            type|version|author|url|support-manually-created-device|support-device-removed-notification|package|icon|configurationSchema|name|description
        - name: page
          value: "0"
          type: query
          description: "Pagination : required page"
          disabled: true
        - name: perPage
          value: "10"
          type: query
          description: "Pagination : page size"
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Access-Control-Allow-Origin
          value: "*"
        - name: Server
          value: yadoms/2.5.3
        - name: Connection
          value: keep-alive
        - name: Content-Type
          value: application/json
        - name: Access-Control-Max-Age
          value: "1728000"
        - name: Access-Control-Allow-Methods
          value: GET, POST, OPTIONS, PATCH
        - name: Access-Control-Allow-Headers
          value: DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Range, Authorization
        - name: Content-Length
          value: "5608"
      body:
        type: json
        data: |-
          {
              "configurationSchema": {
                  "StringParameter": {
                      "type": "string",
