info:
  name: available plugins
  type: http
  seq: 1

http:
  method: GET
  url: http://{{yadoms_ip}}:{{yadoms_port_v2}}/rest/v2/plugins?byType=dev-fakePlugin&prop=configurationSchema|customLabels
  headers:
    - name: Accept-Language
      value: fr
      description: "Optional : provides translations if requested (en langugage if requested language not found)"
  params:
    - name: byType
      value: dev-fakePlugin
      type: query
      description: "[optional] Filter by plugin type. Returns all plugins if ommited"
    - name: prop
      value: configurationSchema|customLabels
      type: query
      description: |-
        [optional] A flags combinaison of following values (returns all values if no prop provided, except for icon that must be requested alone) :
        type|version|author|url|support-manually-created-device|support-device-removed-notification|package|icon|configurationSchema|name|description
    - name: page
      value: "0"
      type: query
      description: "Pagination : required page"
      disabled: true
    - name: perPage
      value: "10"
      type: query
      description: "Pagination : page size"
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: available plugins (filtered)
    request:
      url: http://{{yadoms_ip}}:{{yadoms_port_v2}}/rest/v2/plugins?byType=LametricTime|rfxcom&prop=type|author|version
      method: GET
      params:
        - name: byType
          value: LametricTime|rfxcom
          type: query
        - name: prop
          value: type|author|version
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Connection
          value: keep-alive
        - name: Content-Length
          value: "146"
        - name: Content-Type
          value: application/json
        - name: Server
          value: yadoms/2.5.1-beta.5
      body:
        type: json
        data: |-
          {
              "plugins": [
                  {
                      "type": "LametricTime",
                      "version": "1.0.2",
                      "author": "Oussama DAHMAZ"
                  },
                  {
                      "type": "rfxcom",
                      "version": "1.3.1",
                      "author": "Sébastien GALLOU"
                  }
              ]
          }
  - name: one plugin
    request:
      url: http://{{yadoms_ip}}:{{yadoms_port_v2}}/rest/v2/plugins?byType=LametricTime
      method: GET
      params:
        - name: byType
          value: LametricTime
          type: query
          description: "[optional] Filter by plugin type. Returns all plugins if ommited"
        - name: prop
          value: type|author|version
          type: query
          description: |-
            [optional] A flags combinaison of following values (returns all values if no prop provided) :
            type|version|author|url|support-manually-created-device|support-device-removed-notification|package
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Connection
          value: keep-alive
        - name: Content-Length
          value: "859"
        - name: Content-Type
          value: application/json
        - name: Server
          value: yadoms/2.5.1-beta.5
      body:
        type: json
        data: |-
          {
              "type": "LametricTime",
              "version": "1.0.2",
              "author": "Oussama DAHMAZ",
              "url": "",
              "supportManuallyCreatedDevice": false,
              "supportDeviceRemovedNotification": false,
              "package": {
                  "type": "LametricTime",
                  "version": "1.0.2",
                  "author": "Oussama DAHMAZ",
                  "credits": "",
                  "supportedPlatforms": "all",
                  "dependencies": {
                      "yadoms": {
                          "minimumVersion": "2.4.0-beta.1"
                      }
                  },
                  "configurationSchema": {
                      "APIKey": {
                          "type": "string",
                          "required": "true",
                          "regex": "[a-zA-Z0-9]{64}"
                      },
                      "PairingMode": {
                          "type": "comboSection",
                          "content": {
                              "Automatic": {
                                  "name": "Auto",
                                  "type": "section",
                                  "content": {
                                      "Port": {
                                          "type": "enum",
                                          "values": {
                                              "Http": "8080",
                                              "Https": "4343"
                                          },
                                          "defaultValue": "Https"
                                      }
                                  }
                              },
                              "Manual": {
                                  "name": "Manual",
                                  "type": "section",
                                  "content": {
                                      "IPAddress": {
                                          "type": "string",
                                          "regex": "^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}$",
                                          "required": "true"
                                      },
                                      "Port": {
                                          "type": "enum",
                                          "values": {
                                              "Http": "8080",
                                              "Https": "4343"
                                          },
                                          "defaultValue": "Https"
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
