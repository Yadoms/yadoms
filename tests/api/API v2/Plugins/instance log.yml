info:
  name: instance log
  type: http
  seq: 3

http:
  method: GET
  url: http://{{yadoms_ip}}:{{yadoms_port_v2}}/rest/v2/plugins-instances/:pluginsInstancesId/logs
  params:
    - name: pluginsInstancesId
      value: ""
      type: path
      description: "[Required] Plugin instance ID"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

