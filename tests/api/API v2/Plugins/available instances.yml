info:
  name: available instances
  type: http
  seq: 2

http:
  method: GET
  url: http://{{yadoms_ip}}:{{yadoms_port_v2}}/rest/v2/plugins-instances/:pluginsInstancesId?page=0&perPage=10
  headers:
    - name: Accept-Language
      value: fr
      description: "Optional : provides translations if requested (en langugage if requested language not found)"
  params:
    - name: prop
      value: displayName|autoStart
      type: query
      description: id|displayName|type|configuration|configurationWithSchema|autoStart|category|state|fullState
      disabled: true
    - name: forManualDeviceCreation
      value: ""
      type: query
      description: "[optional] Returns only plugins instances supporting manuel device creation if provided"
      disabled: true
    - name: page
      value: "0"
      type: query
      description: "Pagination : required page"
    - name: perPage
      value: "10"
      type: query
      description: "Pagination : page size"
    - name: pluginsInstancesId
      value: "2"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

