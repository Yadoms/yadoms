info:
  name: update device
  type: http
  seq: 4

http:
  method: PATCH
  url: http://{{yadoms_ip}}:{{yadoms_port_v2}}/rest/v2/devices/:deviceId
  params:
    - name: deviceId
      value: "42"
      type: path
  body:
    type: json
    data: "{\r

      \    \"friendlyName\": \"new friendly name\",\r

      \    \"model\": \"new model\",\r

      \    \"configuration\": {\r

      \        \"CounterDivider2\": {\r

      \            \"type\": \"int\",\r

      \            \"defaultValue\": 2,\r

      \            \"minimumValue\": 1,\r

      \            \"maximumValue\": 10,\r

      \            \"name\": \"Prédiviseur n°2\",\r

      \            \"description\": \"Prédiviseur permettant de diminuer la fréquence du compteur (tous les devices)\",\r

      \            \"value\": 8\r

      \        },\r

      \        \"MySection\": {\r

      \            \"type\": \"section\",\r

      \            \"content\": {\r

      \                \"SubIntParameter\": {\r

      \                    \"type\": \"int\",\r

      \                    \"defaultValue\": 65535,\r

      \                    \"name\": \"Entier dans une section\",\r

      \                    \"description\": \"Un exemple de paramètre entier dans une section\",\r

      \                    \"value\": 65535\r

      \                },\r

      \                \"SubStringParameter\": {\r

      \                    \"type\": \"string\",\r

      \                    \"name\": \"Chaîne dans une section\",\r

      \                    \"description\": \"Un exemple de paramètre chaîne dans une section\",\r

      \                    \"defaultValue\": \"Les sous-sections rendent la configuration vraiment puissante !\",\r

      \                    \"value\": \"sss\"\r

      \                },\r

      \                \"SubComboParameter\": {\r

      \                    \"type\": \"comboSection\",\r

      \                    \"content\": {\r

      \                        \"first\": {\r

      \                            \"type\": \"section\",\r

      \                            \"content\": \"\",\r

      \                            \"title\": \"Première section\",\r

      \                            \"description\": \"Première section de la liste : vous pouvez ajouter ici d'autres données de configuration\"\r

      \                        },\r

      \                        \"second\": {\r

      \                            \"type\": \"section\",\r

      \                            \"content\": \"\",\r

      \                            \"title\": \"Seconde section\",\r

      \                            \"description\": \"Seconde section de la liste : vous pouvez ajouter ici d'autres données de configuration\"\r

      \                        },\r

      \                        \"third\": {\r

      \                            \"type\": \"section\",\r

      \                            \"content\": \"\",\r

      \                            \"title\": \"Troisième section\",\r

      \                            \"description\": \"Troisième section de la liste : vous pouvez ajouter ici d'autres données de configuration\"\r

      \                        }\r

      \                    },\r

      \                    \"name\": \"Sous liste dans une section\",\r

      \                    \"description\": \"Exemple d'une liste dans une sous-section\",\r

      \                    \"activeSection\": \"first\"\r

      \                }\r

      \            },\r

      \            \"name\": \"Une section\",\r

      \            \"description\": \"Exemple d'utilisation d'une section de configuration.\"\r

      \        }\r

      \    },\r

      \    \"blacklist\": false\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: update device
    request:
      url: http://{{yadoms_ip}}:{{yadoms_port_v2}}/rest/v2/devices/4
      method: PATCH
      body:
        type: json
        data: "{\r

          \    \"friendly-name\": \"new friendly name\",\r

          \    \"model\": \"new model\",\r

          \    \"configuration\": {\r

          \        \"field\": \"new value\"\r

          \    },\r

          \    \"blacklist\": false\r

          }"
    response:
      status: 204
      statusText: No Content
      headers:
        - name: Connection
          value: keep-alive
        - name: Content-Length
          value: "0"
        - name: Server
          value: yadoms/2.5.1-beta.5
      body:
        type: text
        data: ""
