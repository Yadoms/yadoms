info:
  name: update script interpreter
  type: http
  seq: 8

http:
  method: POST
  url: http://{{yadoms_ip}}:{{yadoms_port_v2}}/rest/v2/updates/scriptInterpreters/:scriptInterpreterName/:version
  params:
    - name: scriptInterpreterName
      value: yPython3
      type: path
      description: The script interpreter name
    - name: version
      value: 1.0.3
      type: path
      description: The requested version
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Update or install a script interpreter
