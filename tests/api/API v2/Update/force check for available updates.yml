info:
  name: force check for available updates
  type: http
  seq: 2

http:
  method: POST
  url: http://{{yadoms_ip}}:{{yadoms_port_v2}}/rest/v2/updates/forcecheck
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: force check for available updates
    request:
      url: http://{{yadoms_ip}}:{{yadoms_port_v2}}/rest/v2/updates/forcecheck
      method: POST
    response:
      status: 204
      statusText: No Content
      headers:
        - name: Connection
          value: keep-alive
        - name: Content-Length
          value: "0"
        - name: Server
          value: yadoms/2.5.1-beta.5
      body:
        type: text
        data: ""

docs: Start to download the list of avilable updates from yadoms.com updates repository. This end-point is optional as Yadoms server periodically downloads the updates list.
