http:
  method: DELETE
  url: http://{{yadoms_ip}}:{{yadoms_port_v2}}/rest/v2/updates/scriptInterpreters/:scriptInterpreterName
  params:
    - name: scriptInterpreterName
      value: yPython3
      type: path
      description: The script interpreter name
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

