info:
  name: new widget
  type: http
  seq: 3

http:
  method: POST
  url: http://{{yadoms_ip}}:{{yadoms_port_v2}}/rest/v2/widgets
  body:
    type: json
    data: |-
      {
        "page": 0,
        "type": "switch",
        "position": 0,
        "title": "My new switch",
        "configuration": {
          "device": {
            "deviceId": 65,
            "keywordId": 179
          },
          "invert": false,
          "askConfirmation": false,
          "kind": {
            "activeSection": "toggle",
            "content": {
              "pushButton": {
                "content": {
                  "icon": ""
                },
                "radio": false
              },
              "toggle": {
                "content": "",
                "radio": true
              }
            }
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
