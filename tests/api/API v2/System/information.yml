      url: http://{{yadoms_ip}}:{{yadoms_port_v2}}/rest/v2/system/information?prop=database|platform|startupTime|developerMode|platformFamily
      method: GET
      params:
        - name: prop
          value: database|platform|startupTime|developerMode|platformFamily
          type: query
          description: |-
            [optional] Set of flags of required values.Returns all values if omitted.
            Supported values : platform|platform-family|yadoms-version|startup-time|executable-path|server-ready|database|developer-mode|database-engine|backup-supported
      body:
        type: text
        data: ""
    response:
      status: 200
      statusText: OK
      headers:
        - name: Access-Control-Allow-Origin
          value: "*"
        - name: Server
          value: yadoms/2.5.3-beta.1
        - name: Connection
          value: keep-alive
        - name: Content-Type
          value: application/json
        - name: Content-Length
          value: "177"
      body:
        type: json
        data: |-
          {
