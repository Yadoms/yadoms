info:
  name: Virtual devices supported capacities
  type: http
  seq: 4

http:
  method: GET
  url: http://{{yadoms_ip}}:{{yadoms_port_v2}}/rest/v2/system/virtual-devices-supported-capacities
  params:
    - name: prop
      value: name|unit
      type: query
      description: |-
        [optional] Set of flags of required values.Returns all values if omitted.
        Supported values : name|unit|type
      disabled: true
  body:
    type: text
    data: ""
  auth:
    type: bearer
    token: jhh

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Virtual devices supported capacities for a given capacity
    request:
      url: http://{{yadoms_ip}}:{{yadoms_port_v2}}/rest/v2/system/virtual-devices-supported-capacities/apparentpower?prop=name|unit
      method: GET
      params:
        - name: prop
          value: name|unit
          type: query
          description: name|unit|type
      body:
        type: text
        data: ""
    response:
      status: 200
      statusText: OK
      headers:
        - name: Connection
          value: keep-alive
        - name: Content-Length
          value: "72"
        - name: Content-Type
          value: application/json
        - name: Server
          value: yadoms/2.5.1-beta.5
      body:
        type: json
        data: |-
          {
              "capacities": [
                  {
                      "name": "apparentpower",
                      "unit": "data.units.voltAmpere"
                  }
              ]
          }
  - name: all virtual devices supported capacities (get name and unit)
