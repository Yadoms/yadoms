  url: http://{{yadoms_ip}}:{{yadoms_port_v2}}/rest/v2/recipients
  body:
    type: json
    data: "{\r

      \    \"firstName\": \"Bart\",\r

      \    \"lastName\": \"Simpson\",\r

      \    \"fields\": {\r

      \        \"freeMobileSms|apiKey\": {\r

      \            \"value\": \"XxXxXxXxXxXxXx\"\r

      \        },\r

      \        \"freeMobileSms|userId\": {\r

      \            \"value\": \"0000000\"\r

      \        },\r

      \        \"system|email\": {\r

      \            \"value\": \"bart.simpson@gmail.com\"\r

      \        },\r

      \        \"system|mobile\": {\r

      \            \"value\": \"+33123456789\"\r

      \        }\r

      \    }\r

      }"
  auth: inherit

settings:
